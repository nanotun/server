name: CI

# 门禁分三层:
#   - 静态:go vet 阻断;staticcheck / govulncheck 信息性(理由见各 job)
#   - 测试:go test ./... 阻断 —— 全仓约 3 分钟,是这个仓最主要的回归网
#   - 竞态:-race 单独放夜间 —— 太慢(cmd/nanotun-web 单包就 672s),挂在每个 PR 上不现实
#
# 为什么必须有测试这一层:此前 CI 只有 build + vet,于是 nanotund 92.5% / web 97.0% /
# admin 97.1% 的覆盖率、两百多条归档变异、132 项三机 e2e、断言库自测 —— 一条都不拦合并。
# 那批守卫测试的全部价值在于「改坏了会有人知道」,没有门禁跑它们就只是一次性的历史记录。

on:
  push:
    branches: [ main ]
  pull_request:
  # 夜间竞态检测(UTC 18:00 = 北京时间凌晨 2 点),另留手动入口。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# 同一分支/PR 上新 push 取消旧运行,省 CI 额度。
# 分组带上 event_name:否则往 main 推一次就会把正在跑的夜间 -race 掐掉(它也在 main 上)。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # 下面四个 job 在 schedule 上跳过:夜间那轮只为跑 -race,把静态检查再跑一遍纯烧额度。
  # workflow_dispatch 不跳 —— 手动触发时通常就是想要一次完整的。
  build-vet:
    name: build + go vet (blocking)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 toolchain 行保持一致:go1.26.5 修掉了多个 stdlib CVE。
          # 升级 go.mod toolchain 时记得同步这里。
          go-version: '1.26.5'
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # 格式漂移靠人看不住:第 47 轮一次就查出两个文件没格式化,其中一个是历史遗留,
      # 混在功能 diff 里没人会注意。third_party 是 vendored 的上游代码,不归我们管。
      - name: gofmt 漂移
        run: |
          drift="$(gofmt -l . | grep -v '^third_party/' || true)"
          if [[ -n "$drift" ]]; then
            echo "以下文件未格式化,跑 gofmt -w 修:"
            echo "$drift"
            exit 1
          fi
          echo "gofmt 干净"

  test:
    name: go test (blocking)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # 本地(多核)整仓 3 分钟,runner 核少会串行一些。30 分钟够宽,又不至于让卡死的
    # 用例白烧六小时额度。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      # -count=1 关掉结果缓存:门禁要的是「这次真的跑过」。
      # -timeout 25m 覆盖 go 默认的单包 10 分钟 —— cmd/nanotund 本地就要 180s,
      # runner 上更慢,默认值会在负载高的时候偶发超时并打出一份看着像死锁的 dump。
      - name: go test
        run: go test ./... -count=1 -timeout 25m
      # 需要 root 的用例(jump_host_firewall、iptables REDIRECT、TUN)都会自己 t.Skip,
      # 所以非 root 的 runner 上不会误红;代价是那几条在 CI 里等于没跑,只能靠三机 e2e。
      - name: 三机 e2e 断言库自测（不连机器）
        run: ./scripts/e2e/selftest.sh

  race:
    name: go test -race (nightly)
    # 只在夜间与手动触发时跑:整仓 -race 太慢,cmd/nanotun-web 单包就要 672s。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      # -timeout 30m 是必须的:默认 10 分钟会在 cmd/nanotun-web 上超时,而超时打出来的
      # goroutine dump 看着极像死锁 —— 踩过一次,查了很久才发现是超时不是死锁。
      - name: go test -race
        run: go test ./... -race -count=1 -timeout 30m

  fuzz:
    name: go test -fuzz (nightly)
    # 与 -race 同理放夜间。常规 go test 只跑 seed corpus —— 那等于把 fuzz 目标当普通单测用,
    # 挂着 fuzz 的名字却没做 fuzz 该做的事。真跑一段才有意义,而每个 PR 上跑不现实。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      # -fuzz 一次只能跑一个目标,故逐个来。120s/个 在本地约能跑到两千万次执行。
      #
      # 崩溃输入会被 Go 写进 testdata/fuzz/<目标>/ 并成为永久回归种子,但 CI 的工作区跑完就没了 ——
      # 所以失败时把它捞成 artifact,否则只剩一行日志,复现要靠人重新撞一次。
      - name: go test -fuzz
        run: |
          set -u
          rc=0
          for t in FuzzReadLinkFrame FuzzParseLoginReq FuzzParseRouteAdvertise \
                   FuzzNormalizeAdvertisedCIDR FuzzMarshalLoginReqJSON \
                   FuzzLinkFrameRoundTrip FuzzReadLinkFrameReencodes \
                   FuzzNormalizeAdvertisedCIDRIsIdempotent FuzzLoginReqRoundTrip; do
            echo "::group::$t"
            go test -run '^$' -fuzz="^$t\$" -fuzztime=120s ./util/ || rc=1
            echo "::endgroup::"
          done
          for t in FuzzHandleMagicDNSPacket; do
            echo "::group::$t"
            go test -run '^$' -fuzz="^$t\$" -fuzztime=120s ./cmd/nanotund/ || rc=1
            echo "::endgroup::"
          done
          exit $rc
      - name: 收集崩溃输入
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            **/testdata/fuzz/**
          if-no-files-found: ignore

  staticcheck:
    name: staticcheck (informational)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: staticcheck
        # 当前残留均为噪声(见 staticcheck.conf 已关掉 SA6002;其余为测试用 deprecated 调用、
        # 自文档算术等)。设为不阻断:红叉会以告警形式显示在日志里但不拦合并。
        # 待把残留项 //lint:ignore 或修掉后,删掉本行即可升级为硬门禁。
        continue-on-error: true
        run: staticcheck ./...

  govulncheck:
    name: govulncheck (informational)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        # 不阻断:存在 GO-2026-5288(hysteria core,上游 Fixed in: N/A 且我们未启用 sniff 路径)这类
        # 「暂无修复但需容忍」的条目,硬阻断会让任何合并都失败。日志里仍会完整列出可达 CVE,便于持续盯防。
        # 上游一旦发布 hysteria 修复版,升级依赖后此处应回到 0 可达。
        continue-on-error: true
        run: govulncheck ./...
