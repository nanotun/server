# e2e 覆盖层:把生产 compose 的命名卷换成宿主目录的 bind mount。
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#
# 为什么需要它:e2e 的断言有一半是站在**宿主**上做的 —— `nanotun-admin --db-path
# /var/lib/nanotun/nanotun.db` 读库、`tomlset.py /etc/nanotun/config.toml` 改配置、
# 控制面命令连 /run/nanotun/control.sock。命名卷躺在 /var/lib/docker/volumes 里,
# 宿主侧这些工具够不着,于是容器与断言看的是两份不同的文件。
#
# 这一层只动存储位置,镜像 / entrypoint / cap_add / devices / network_mode 全部沿用
# 生产那份 —— 被测的是同一个容器,不是一个为测试特制的容器。
services:
  nanotun:
    volumes: !override
      - /etc/nanotun:/etc/nanotun
      - /var/lib/nanotun:/var/lib/nanotun
      # 控制面 socket:生产那份放 tmpfs(纯运行时产物,不该留在镜像层)。这里必须让
      # 宿主也看得见,否则 nanotun-admin 连不上控制面,一半阶段直接跑不起来。
      - /run/nanotun:/run/nanotun
    tmpfs: !reset null
