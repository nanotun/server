# nanotun —— 开发 / 试用快速起一套。数据可丢,重来只需删目录。
#
#   cd docker && docker compose -f docker-compose.dev.yml up --build
#
# 这也是**唯一**从本地源码构建镜像的 compose:生产那份改成直接拉 GHCR 的预构建镜像了,
# 想验证自己改的代码就用这份。
#
# 与生产那份的区别只有三点,都是为了「方便看、方便改、方便推倒重来」:
#
#   1. 用 bind mount 挂到 ./data/ 而不是 named volume —— 配置和 SQLite 库就在
#      你眼皮底下,想 `sqlite3 data/lib/nanotun.db` 或直接改 config.toml 都不用进容器。
#      不要拿这个跑生产:这些目录里有 REALITY 私钥、hy2 口令和全部用户数据,
#      而 bind mount 的权限完全跟着宿主目录走。
#   2. 前台跑、日志不限量、debug 级别。
#   3. 不 restart —— 崩了就让它崩着,现场留在那儿给你看。
#
# 想连真客户端试的话,建议仍用 host 模式(下面默认就是),否则端口跳跃和出口都不是真实行为。
#
# ——但这句只在**宿主是 Linux** 时成立。Mac / Windows 上容器跑在 Docker Desktop 的 Linux
# 虚拟机里,host 指的是那台 VM 而不是你的机器:它没有 WAN 网卡,又躲在两层 NAT 后面。
# 那三样"真实行为"一个都拿不到,偏偏还全都不报错(照样开 ip_forward、照样写 iptables,
# 全写进 VM)。所以非 Linux 宿主只适合把这套东西起起来看看,不是能对外服务的部署方式,
# 详见 docs/DOCKER.md 里「在 Mac / Windows 上」那节。
# 首次启动的 PSK 会打在日志里,也会落到 ./data/lib/init.out.json。

services:
  nanotun:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NANOTUN_VERSION: dev
    image: nanotun:dev
    container_name: nanotun-dev

    network_mode: host

    cap_add:
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun:/dev/net/tun

    init: true

    volumes:
      - ./data/etc:/etc/nanotun
      - ./data/lib:/var/lib/nanotun

    tmpfs:
      - /run/nanotun:mode=0750

    environment:
      NANOTUN_WEB_ENABLED: "1"
      NANOTUN_WEB_LISTEN: "0.0.0.0:7443"

    stop_grace_period: 15s
