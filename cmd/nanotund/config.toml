# VPN data plane: HTTP + WebSocket Upgrade on listen_addr; link frames ride inside WS Binary.
# Self-hosted PSK mode: users and PSKs live in the local SQLite database ([store].db_path) and
# are managed by the nanotun-admin CLI. See nanotun-admin/README.md for details.

[server]
# Loopback only by default. This is the data-plane WS endpoint: production clients (iOS/Android)
# always come in over hy2 (:443/udp) or REALITY (:8443/tcp), and the server bridges them here on
# the local machine (dial 127.0.0.1:<port>). Clients **never** connect to this port directly —
# so there is no reason to expose it to the internet (exposing it only adds one more attack
# surface, guarded by nothing but the path token). The install scripts no longer open 8080/tcp
# for the same reason.
# Change this to ":8080" (all interfaces) and open the firewall yourself only if you really do
# want clients (or the Go test client in this repo) to dial this port over wss:// directly.
listen_addr = "127.0.0.1:8080"
# Linux: when true, inbound traffic is restricted to [server].jump_host_allowed_ips for **this
# listening TCP port only** (fixed names: ipset nanotun_jump_src, chain NANOTUN_JUMP). Needs
# ipset/iptables; changing the listen port does not change those names.
# A normal exit / SIGINT / SIGTERM all clean up along the LIFO defer chain (jump_host → hy2
# porthop → store WAL checkpoint → TUN close). On abnormal paths (SIGKILL / panic / OOM) the
# rules are left behind, but on the next start every module sweeps rules of the same name before
# rebuilding them, which keeps this idempotent.
jump_host_firewall = false
# With jump_host_firewall enabled, the jump hosts' IPv4 addresses must be listed here
# (127.0.0.1 is added automatically). An empty list plus jump_host_firewall=true is fatal, which
# avoids the "thought the restriction was on, actually open to the whole internet" trap.
# jump_host_allowed_ips = ["1.2.3.4", "5.6.7.8"]
# May share the hy2 dev certificate; with relative paths, start from the server directory;
# leave these unset and the endpoint stays plain ws.
tls_cert_file = "certs/dev-cert.pem"
tls_key_file = "certs/dev-key.pem"
# WebSocket path (must start with /); the loopback hy2/REALITY side and public clients have to
# agree on it; omit it and the long default compiled into the code is used.
# In production always switch to a long random path of your own (for example generate the last
# segment with openssl rand -hex 20) — do not copy this public example value.
vpn_websocket_path = "/internal/nanotun/data-plane/ws/v1/REPLACE_WITH_YOUR_RANDOM_TOKEN"
# Throughput limit on a single VPN TCP link (bytes/sec); 0 means no limit
upload_rate = 20971520   # 20 MiB/s, for the client → server direction (Read)
download_rate = 20971520 # 20 MiB/s, for the server → client direction (Write)
# Overridden by the platform in the login JSON (lowercase, same values as runtime.GOOS); a 0 in
# either entry means that direction keeps the global value above
# [server.rate_limit_by_platform.android]
# upload_rate = 1048576
# download_rate = 2097152

# Per-IP login rate limit: how many login attempts a single source IP may make per minute
# (decided before the argon2 verify).
#   0 = no limit (default); N>0 = at most N per IP per minute (burst fixed at 3), 429 beyond it.
# The main anti-brute-force defence is the always-on PoW plus the argon2id concurrency cap; this
# is only an optional backstop, and 0 is the recommendation where flaky networks make clients
# reconnect often.
# Hot-reloadable via SIGHUP (switching to 0 lifts the limit immediately).
login_rate_limit_per_min = 0

# P2#11 Magic DNS: the server runs a built-in DNS server that resolves peer hostnames
# (`<device>.<user>.<suffix>`) to vIPs, so clients need not remember 100.64.0.x. Disabled by
# default; once enabled, note:
#
# ★ Important — listen_port defaults to 53; read all three deployment traps below before enabling:
#
#   1. A client's stub resolver always talks to :53. If an operator moves this to a
#      non-standard port such as 5353, the server skips prepending the gateway DNS to the
#      client (logging one Warn, see the log), and the client's DNS stays at
#      [tun].dns_servers_v4. A non-standard port only suits topologies where "the server
#      itself runs dnsmasq / systemd-resolved as a forwarder on :53 and hands the real
#      resolution to :5353".
#
#   2. System-level DNS port conflicts:
#      - systemd-resolved listens on 127.0.0.53:53 by default (a specific IP), which is a
#        different IP from the server's 100.x.x.x:53, so it does **not** conflict — just
#        enable it;
#      - dnsmasq / Pi-hole and friends listening on 0.0.0.0:53 (all IPs) do conflict with the
#        server binding TUN gateway IP:53 → the server logs "address already in use" at
#        startup and the magic_dns module does not come up (the main server process keeps
#        running). Fix: make dnsmasq listen on a specific IP only (`bind-interfaces`
#        + `listen-address=127.0.0.1`), or move nanotun's listen_port to 5353 and do the
#        53→5353 forwarding yourself (see the previous item).
#
#   3. Privileges: the server process already starts as root (TUN needs that), so binding :53
#      costs nothing extra; non-root deployments (rootless containers) need
#      cap_net_bind_service.
#
# Other behaviour:
#   - On login a client receives the TUN gateway IP as its first DNS server, so the system-wide
#     DNS goes there first;
#   - Without upstream_v4/v6, queries for non-magic domains return SERVFAIL — "magic-only" mode;
#   - The DNS server listens on the TUN gateway IP only; it is never exposed to the WAN.
#   - **Both UDP and TCP are served** (RFC 7766 requires the pair): when a reply exceeds the
#     asker's EDNS buffer it is marked TC=1, and the asker's only recourse is to retry over TCP,
#     so serving UDP alone leaves large replies unresolvable for good. Deployments with their own
#     firewall must allow **both** udp/53 and tcp/53 on the gateway IP (the iptables exceptions
#     the server installs itself already cover both). A TCP listener that fails to come up is
#     only logged and does not affect UDP (what is lost is the truncation fallback); only a
#     failed UDP bind takes the whole magic_dns module down.
#   - Coexistence with the exit DNS takeover (exit_dns_redirect, auto by default) is handled
#     automatically: with enabled=true the server adds a RETURN for "gateway IP:53" in nat
#     PREROUTING (ordered before the takeover's :53 DNAT), and accepts "gateway IP:53" in
#     filter INPUT (getting past -P INPUT DROP / ufw). Otherwise queries aimed at magic DNS get
#     hijacked away by the takeover DNAT / dropped by the default INPUT policy. Only in effect
#     when listen_port=53 (on a non-standard port the client stub never asks the gateway at all,
#     see trap 1 above).
#     **Both v4 and v6 are allowed**: magic DNS listens on the gateways of both families as a
#     pair, and clients (certainly iOS in mesh-only mode) put the mesh ULA gateway into their
#     resolver list as well — without that v6 ACCEPT, on a machine running `ip6tables -P INPUT
#     DROP` (which is what having ufw on amounts to) the socket is plainly LISTENing and the
#     query really does reach tun0, yet it is dropped before it gets into the socket: every
#     client that picked the v6 resolver silently fails to resolve AAAA / 4via6. (Measured on
#     iOS 18.7.9 on 2026-08-17, the v4 gateway is the one actually used, AAAA included, so the
#     v6 rule is a backstop; but the symptom of a missing backstop is extremely hard to track
#     down, so don't skip it.)
#     The v6 side installs only the INPUT ACCEPT, no nat RETURN: the exit DNS takeover's DNAT
#     exists on v4 only, so on v6 there is nothing to route around.
#
# Magic hostname rules (after the trailing .<suffix> is stripped, told apart by label count /
# first label; both matched strictly):
#   A) device   <device>.<user>.<suffix>              → that device's mesh virtual IP (A/AAAA)
#      e.g. vultr.smoker.nanotun                      → 10.201.0.36
#   B) 4via6    <v4-dashed>via<siteID>.<suffix>       → the 4via6 address of a LAN host at that site (AAAA)
#      e.g. 192-168-199-1via3.nanotun                 → fdbc:4a60::3:c0a8:c701 (siteID=3)
#      · <v4-dashed> = the target LAN IPv4 with the dots written as hyphens
#        (192.168.199.1 → 192-168-199-1);
#      · <siteID> = the advertiser's globally unique site number in the via6_sites table
#        (AUTOINCREMENT, ≥1), immediately after the literal "via" (a "-via-" variant is also
#        accepted for readability, e.g. 192-168-199-1-via-3); once the suffix is stripped the name
#        must be a **single label** (no ".") to be read as 4via6, otherwise rule A applies;
#      · Why siteID and not device/user (matching Tailscale's 4via6): site_id is globally unique
#        and stable, while device names can repeat under one user → going by name would misroute
#        or even fail closed. So a 4via6 name carries only "target v4 + numeric siteID" and is
#        completely decoupled from device/user names (see parseVia6Hostname in magic_dns.go);
#      · What it is for: disambiguation when the client's own LAN overlaps the advertiser's
#        subnet — dialing that v4 directly only ever reaches the local one; only this name gets
#        through, over 4via6, to the same-subnet host inside the advertiser's LAN;
#      · Resolution succeeds only when the target v4 falls inside an **approved advertised
#        subnet** of the advertiser behind that siteID (NameError otherwise).
#   Rule A normalizes <device>/<user> before matching (lowercase, spaces/underscores → hyphens),
#   so a device named "Alice Work MacBook" is written alice-work-macbook.<user>.<suffix>;
#   characters outside ASCII are carried through as they are.
#   A port in a URL is the target service's port and has nothing to do with DNS: e.g.
#   http://192-168-199-1via3.nanotun:8899/ resolves to IPv6 and then really connects to
#   [fdbc:4a60::3:c0a8:c701]:8899.
#
[server.magic_dns]
enabled = true
domain_suffix = "nanotun"
listen_port = 53
# upstream_v4/v6: the upstream resolvers for non-magic domains — **do configure these**. Left
# empty → non-magic queries return SERVFAIL ("magic-only"): the client takes the gateway as its
# first / only DNS, so under a full tunnel all public DNS breaks (the mac client goes further and
# collapses the tunnel's DNS down to the gateway alone). Once configured, the gateway forwards
# upstream: magic names resolve locally, public names work as usual (replies carry A/AAAA). Pick
# upstreams that are nearby and reachable (on a node outside China, put the neutral ones first).
upstream_v4 = ["223.5.5.5", "8.8.8.8"]
upstream_v6 = ["2001:4860:4860::8888"]
# ecs_forward: when forwarding a non-magic domain upstream, attach EDNS Client Subnet (RFC 7871,
# the /24 (v4) / /56 (v6) of the client session's peer IP), so the upstream does its CDN steering
# by **where the client is** rather than **where this machine is**.
#
# What it looks like without it (measured on real hardware: a client in Chongqing → a server in
# Singapore, full tunnel): the upstream only ever sees the server's address, so www.baidu.com
# gets steered to 45.113.192.x / 103.235.46.x (Hong Kong / overseas nodes) where the client's own
# vantage point should have given 153.3.238.x. The name resolves, the site loads, but every CDN
# request takes the long way round — a quiet symptom, easily mistaken for "the tunnel is slow".
# With it on, the same query comes back with a node inside China. Cross-border deployments
# (server and users in different regions) almost always want this on.
#
# Cost and prerequisites:
#   · A privacy trade-off — the client's /24 is disclosed to the upstream. Hence false by
#     default: the operator has to choose it explicitly;
#   · The upstream must support ECS (223.5.5.5 / 8.8.8.8 do; carrier-internal resolvers mostly
#     ignore it, harmlessly and without an error);
#   · Automatically skipped when the client's peer IP is private / loopback / link-local / CGNAT
#     (not globally unicast) — a client in the same datacenter or behind NAT carries no usable
#     geographic information, and nothing is attached on a guess.
#
# Note: for the client side to actually benefit, public domains really have to be asked of the
# gateway under a full tunnel (the Windows client installs an NRPT catch-all for this; mac/iOS
# rely on matchDomains=[""]). When a client bypasses the gateway and asks a public resolver
# directly, this setting has no way to take effect.
ecs_forward = false
# via4_pool: the **synthetic A-record pool** for 4via6 names (DNS46 + NAT46).
#
# Why it is needed: a 4via6 name (such as 192-168-1-10via7.nanotun) originally answered AAAA only,
# and Apple platforms **do not send an AAAA query at all** when the system has no default v6
# route (pinned down on real iOS hardware, 2026-08-17) — under iOS "mesh-only" a via name is
# simply a dead name. With this pool enabled, an A query for a via name is answered with an
# address allocated from the pool (the pool address ⇔ (site, target v4) mapping lives in server
# memory); the data plane statelessly rewrites v4 packets sent to a pool address into 4via6 v6
# packets and merges them into the existing subnet-route forwarding path, then translates the
# return traffic back to v4 — **no client changes whatsoever**, and iOS/Android/Windows all
# benefit.
#
# Values:
#   · empty / absent → the default "100.100.0.0/16" (a CGNAT range, so it collides with neither
#                      home nor corporate RFC1918 LANs), i.e. on by default whenever magic_dns is;
#   · "off"          → explicitly off (via names keep the old AAAA-only behaviour);
#   · custom         → an IPv4 CIDR, prefix ≤ /28, and it must not overlap [tun].subnets
#                      (validated at startup; a violation refuses to start).
#
# Behaviour details:
#   · The pool prefix is handed out with routes-list as a synthetic entry owned by the server, so
#     a client with accept-routes on installs the route automatically (exactly the same
#     precondition as 4via6's fdbc:4a60::/64);
#   · A replies have a TTL of 30s; a mapping idle for 4h may be reclaimed by LRU once the pool is
#     full; a server restart loses the mappings (via4 connections in flight break, and the client
#     heals itself by re-querying DNS) — in line with what NAT64 deployments take for granted;
#   · Translated flows have their TCP MSS clamped to 1220 (which guarantees ≤ the client's mesh
#     MTU of 1280 once translated to v6); v4 fragments and UDP over 1260 bytes are not translated
#     (counted as drops, visible as via4_dropped in /status); of ICMP only echo is translated
#     (so ping works).
#via4_pool = "100.100.0.0/16"

[log]
level = "info"

[tun]
# On startup the server first `ip link delete`s any interface of the same name and recreates it.
# So this name **must not** be the one a nanotun client on this machine is using (the client
# defaults to nanotun0, with the name recorded in /var/lib/nanotun/tun_name) — otherwise every
# server start cuts the client's data plane, and all the client end shows is "it drops whenever
# the server restarts". The default tun0 does not clash with the client; if the two really are
# configured the same, the server refuses to start and says why rather than deleting it quietly.
device_name = "tun0"
# Concurrent connection cap per virtual IP (iptables connlimit). ≤0 is treated as 40.
# Written into the FORWARD chain **at startup only**, not rebuilt on SIGHUP — a change takes
# effect only after a restart.
tcp_connlimit_per_ip = 40
udp_connlimit_per_ip = 60
# DROP outbound traffic forwarded out of the TUN by destination port (set false when not wanted)
forward_block_bt = false
forward_block_tracker_6969 = false
forward_block_smtp_25 = false
# Self-hosted mesh default: clients on the same TUN can reach each other (remote desktop / SMB /
# SSH / VoIP).
# true: inserts a device→device DROP into the FORWARD chain, forbidding any client-to-client
# traffic (public-exit style / guest networks).
# Fine-grained application-layer policy is managed in store/acl.go (user_a, user_b →
# allow/deny) and has nothing to do with this switch.
# Note: since P2#16 exit_mode wins; client_isolate is only the compatibility path when exit_mode
# is empty / unrecognized.
client_isolate = false
# P2#16: a three-way TUN egress switch, expressing finer topologies than client_isolate.
#   mesh    (default) clients on the same TUN may reach each other, and may go out to the WAN
#           (SNAT/MASQUERADE).
#   isolate clients on the same TUN may not reach each other, but may still go out to the WAN
#           (public exit / guest network).
#           Mutually exclusive with "exit nodes" and "subnet routes" — both of those relay
#           through another client, and the return path runs straight into the client-to-client
#           DROP. Under isolate, EgressSelect refuses outright (reason=isolate), and at startup
#           a WARN is logged for exit devices / subnet routes already approved in the database.
#           Switch to mesh if you want to use them.
#   off     no WAN egress (no NAT installed, FORWARD device->wan DROP); only clients on the same
#           TUN may reach each other (pure mesh).
# Empty → falls back to the client_isolate compatibility path (true→isolate, false→mesh).
# Getting off mode requires writing exit_mode = "off" explicitly.
# This field cannot be hot-reloaded with SIGHUP (changing it touches the conntrack table and the
# NAT chains, and with them live connections); after changing it, systemctl restart.
exit_mode = "mesh"
# How hard the egress direction blocks "link-local / private destinations". Egress mode installs
# "allow every destination reachable through the WAN interface", and that sentence quietly covers
# two kinds of place only the server itself has any business reaching:
#   1) cloud metadata at 169.254.169.254 — what it hands out is this machine's identity:
#      hostname / network config / SSH public keys, on AWS the IMDSv1 temporary IAM role
#      credentials, on GCP and Azure the service-account token;
#   2) the private network the server sits in — in the single-NIC cloud shape (AWS/GCP/Azure) the
#      internal address and the outbound traffic share one card, so the "WAN interface" is at the
#      same time the "way into the VPC", and a neighbour's database / internal admin page is
#      often protected by nothing more than being inside that VPC.
#   auto      (default; empty means the same) blocks link-local plus the automatically detected
#             private ranges that are on-link on, or routed through, the WAN interface (RFC1918,
#             CGNAT 100.64/10, ULA). The startup log prints which prefixes were actually blocked.
#   link-local blocks link-local only. Private ranges stay allowed — this leaves a door open for
#             deployments where the server doubles as the LAN gateway, but a single-NIC cloud VPC
#             is still exposed, and picking this means knowing that.
#   off       blocks nothing at all.
# Does not affect client-to-client traffic (tun→tun) or approved subnet routes (delivered in
# userspace straight to the advertiser's session); prefixes in the detection result that overlap
# the mesh ranges are explicitly removed. Cannot be hot-reloaded with SIGHUP; after changing it,
# systemctl restart.
exit_deny_private = "auto"
# Candidate ranges; at startup the first one that does not clash with this machine is picked
# (once picked it sticks, so a restart still gets the same range).
# 10.200~10.202/16 stay clear of the common 10.0.x home LANs.
#
# That last 100.99/16 is the backstop for machines whose own address is 10.x/**8** — corporate
# networks and some clouds hand out exactly that, and a single 10.5.3.4/8 collides with all three
# ranges above at once. Then not one IPv4 range can be picked: the service comes up as usual and
# leaves a single line of warning in the log, while clients never get an IPv4 virtual IP again —
# a VPN that "looks perfectly healthy" with only IPv6 actually working.
# CGNAT's 100.64/10 was chosen because it is neither a home LAN range nor part of Docker's default
# address pool, which makes it the least likely to collide (and if it does collide after all, the
# conflict check above skips it just the same).
subnets = [
  "10.200.0.0/16",
  "10.201.0.0/16",
  "10.202.0.0/16",
  "100.99.0.0/16",
]
# IPv6 ULA range (optional); empty means no IPv6 virtual address is assigned
subnets_v6 = [
  "fd00:200::/64",
]
# Handed out with ConvSaltLite after a successful login; dns_servers_v6 is not sent when there is
# no IPv6 virtual range or the v6 tunnel is not enabled
dns_servers_v4 = [
  "8.8.8.8",
  "114.114.114.114",
]
dns_servers_v6 = [
  "2001:4860:4860::8888",
  "2001:4860:4860::8844",
]

# On the main plaintext VPN port: if this [smux] section is configured and [hysteria] or [reality]
# below is enabled, the hy2/REALITY loopback to 127.0.0.1:<[server].listen_addr> shares one TCP
# connection, carrying each VPN session as an smux stream on top of it (magic prefix VPN1 in the
# first packet). Without [smux] it stays one dial per hy2 TCP stream / per REALITY client.
# The KCP in server-simple / client-simple still uses the [smux] in the config in its own directory.

[smux]
version = 1
# keepalive_disabled = false
# keepalive_interval_s = 10
# keepalive_timeout_s = 30
# max_frame_size = 32768
# Loopback smux; when it is the same order of magnitude as the [server] link rate limits it can
# be tightened further, saving RSS
max_receive_buffer = 1048576
max_stream_buffer = 32768

# In-process Hysteria 2 (QUIC/UDP). Enabled when password + tls_cert_file + tls_key_file are all
# non-empty.
# Certificate paths resolve relative to the *current working directory*; when a certificate is
# missing, run scripts/ensure-server-assets.sh first to self-sign one. To start from inside this
# repo: cd cmd/nanotund && ./nanotund -config config.toml
# Binding UDP :443 usually needs root or setcap; without the privilege, change listen_addr to a
# high port such as ":8443".
# Port hopping (against single-UDP-port blocking): listen_addr = ":443,8443,5000-5100" (on Linux
# an iptables REDIRECT to the first port, 443, is set up automatically).
# port_hop_interval_sec = 30  # optional, handed out to clients; port_hop_interval_min_sec /
#                               max_sec give a randomized interval instead.
# I3: port_hop_iface = "eth0"  # optional; restricts the inbound interface of the Linux iptables
#                                 PREROUTING REDIRECT rules. Empty = no interface restriction
#                                 (backward compatible); on multi-NIC hosts / container hosts,
#                                 naming the WAN interface explicitly is strongly recommended.
# The TCP egress points at this machine's [server] port: without [smux], one Dial per hy2 stream;
# with [smux], many streams over the loopback smux. See cmd/nanotund/hysteria.go for details.
[hysteria]
listen_addr = ":443"
tls_cert_file = "certs/dev-cert.pem"
tls_key_file = "certs/dev-key.pem"
# Hy2 mTLS (on by default): client certificates are distributed through the profile; admin has
# moved to Ed25519 + PKCS8 (~950 B per pair) plus top-level sharing, so with it on, single- and
# multi-entry profile URLs still fit inside QR Low 2953.
# In the rare case mTLS is not wanted (out-of-band control access, say, or the profile has to fit
# QR Medium 2331), comment out the line below to rely on password + obfs alone.
# 2026-07-17: the separate WSS keepalive (:8444/keepalive_ws_*) has been retired; the data plane's
# 1s link Ping covers everything it used to do.
tls_client_ca_file = "certs/dev-client-ca.pem"
password = "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
# Must match the official client's obfs.salamander.password exactly; ≥4 bytes
obfs_salamander_password = "REPLACE_WITH_ANOTHER_RANDOM_OBFS_PASSWORD"

# Matches the official hysteria client's mtu, handed out with node_login (bytes)
mtu = 1280

# QUIC (0 = hysteria's defaults ≈ 8 MiB per stream / 20 MiB per connection). Over the public
# internet, hy2 is still bound by window × RTT before the [server] limits even apply: throughput
# is roughly ≤ max_conn_window/RTT, and too small a window pins it at about 10 MiB/s (a 2 MiB
# window with 200 ms RTT, for instance)
# Sized to match the ~20+ MiB/s upload/download above; set them all to 0 to go back to hysteria's
# defaults, or raise them further for higher bandwidth (must be ≥ 16384)
quic_max_idle_timeout_sec = 15
quic_initial_stream_recv_window = 1048576
quic_max_stream_recv_window = 8388608
quic_initial_conn_recv_window = 4194304
quic_max_conn_recv_window = 16777216
quic_max_incoming_streams = 16
# quic_disable_path_mtu_discovery = false

# bandwidth_max_tx_bps = 0
# bandwidth_max_rx_bps = 0
# ignore_client_bandwidth = false
# udp_relay_enabled = false
# udp_idle_timeout_sec = 10
# forward_dial_timeout_sec = 0

masquerade_dir = "masquerade"

# Used by nanotun-admin when it generates a profile (this does not affect how the server runs);
# with a self-signed certificate insecure_hint=true is the recommendation, which gives the client
# tls.insecure: true. For a production deployment with a real certificate, set insecure_hint to
# false.
report_tls_sni = "localhost"
report_tls_insecure_hint = true

# REALITY inbound (the same stack as Xray-core v26.3.27 / rust_reality). After a successful
# handshake it loops back to this machine's [server].listen_addr (127.0.0.1:8080, say):
# without [smux], one TCP dial per client; with [smux] configured and either [hysteria] or this
# section in effect, it shares the loopback smux with hy2 (one TCP + VPN1 + many streams).
# As with Hysteria into VPN, the Accept side goes through dispatch and then the very same login
# frame + TUN. dest must be reachable; at startup a probe dial to dest records the handshake
# record length.
[reality]
listen_addr = ":8443"
dest = "www.microsoft.com:443"
type = "tcp"
xver = 0
# private_key is an X25519 private key (RawURL Base64). Generate it either way:
#   xray x25519                          # ships with Xray, prints private/public together
#   openssl genpkey -algorithm X25519    # then export the raw key yourself and base64url it
# The matching public key is what clients / Xray's realitySettings.publicKey / rust_reality's
# public key setting use (never hand the private key to clients).
# **Do replace this — never go live with any example value.**
private_key = "REPLACE_WITH_YOUR_X25519_PRIVATE_KEY"
server_names = ["www.microsoft.com"]
# Several entries are allowed: a client's shortId matching any one of them is enough. Each is
# 8 bytes = 16 hex characters (shorter values are left-padded with 0, but writing the full 16 is
# the recommendation in production).
# Generate with: openssl rand -hex 8. **Replace the example values before going live.**
short_ids = [
  "0123456789abcdef",
  "fedcba9876543210",
]
show = false
max_time_diff_ms = 0
client_addr = "example.com:8443"

# ===========================
# Self-hosted PSK storage layer
# ===========================
# Users / devices / vIP leases / ACLs / audit_logs all live in the local SQLite database and are
# managed by the nanotun-admin CLI (see nanotun-admin/README.md).

[store]
# Path to the SQLite database file. On first start it is created and migrated to the latest
# schema. When the database is moved during a deployment, be sure to move the data with it — see
# the K1 "old DB check" branch in scripts/install-self-hosted.sh and
# docs/POSTMORTEM-20260521-db-path-migration.md.
#
# K2 (2026-05-23): use an absolute path, lined up exactly with install-self-hosted.sh's LIB_DIR
# and systemd's ReadWritePaths=/var/lib/nanotun. The old value "data/nanotun.db" was relative to
# WorkingDirectory=/etc/nanotun, which together with systemd's ProtectSystem=strict fails
# outright with "read-only file system"; and the admin CLI goes through
# --db-path /var/lib/nanotun/nanotun.db, so a mismatch leaves the server on an empty database
# while admin sees no users (the near neighbour of the 2026-05-21 incident).
db_path = "/var/lib/nanotun/nanotun.db"

# The [admin] section is deprecated and deliberately no longer appears in this template.
#
# It used to be the placeholder config for an "admin Web UI", but that milestone eventually
# landed as the separate nanotun-web (7443 by default, certificate certs/cert.pem, self-signed on
# demand by nanotun-web itself), and no code reads [admin]. The config.AdminConfig struct is still
# kept, purely so that an [admin] section already present on an older machine passes strict
# validation — see the comment in config/config.go.
#
# So: writing enabled = true starts no listener, and the certificate tls_cert_file points at is
# neither generated nor loaded. Don't count on it; it is a silent no-op. Leaving the section in an
# old config is harmless, and it can simply be deleted.
